name: renaissance-server1

services:
  server1:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SERVER1_IMAGE:-renaissance-server1:latest}
    env_file:
      - ./RENAISSANCE-ECELL-2026/server1/.env
    environment:
      NODE_ENV: production
      PORT: "5001"
    ports:
      - "${SERVER1_HOST_PORT:-5001}:5001"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
